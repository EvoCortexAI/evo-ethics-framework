name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, macOS, ARM64, apple-ci, xcode-26-6]
    steps:
      - uses: actions/checkout@v4

      - name: Validate Swift package
        run: swift test

      - name: Install schema validation dependencies
        run: |
          set -euo pipefail

          # Prefer modern Python; the organization self-hosted runner currently
          # has system python3 == 3.9 which cannot satisfy jsonschema 4.26.
          if command -v python3.12 >/dev/null 2>&1; then
            PYTHON=python3.12
          elif command -v python3.11 >/dev/null 2>&1; then
            PYTHON=python3.11
          elif command -v python3.10 >/dev/null 2>&1; then
            PYTHON=python3.10
          else
            PYTHON=python3
          fi

          echo "Using interpreter: $($PYTHON --version) ($($PYTHON -c 'import sys; print(sys.executable)'))"

          $PYTHON -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install --disable-pip-version-check \
            jsonschema==4.26.0 \
            PyYAML==6.0.3

      - name: Validate schemas, policies, examples, and vectors
        run: .venv/bin/python scripts/validate_specs.py

      - name: Run cross-implementation conformance vectors
        run: |
          BIN_PATH="$(swift build --show-bin-path)/evo-ethicsctl"
          .venv/bin/python scripts/run_conformance.py "$BIN_PATH"

      - name: Evaluate public examples
        run: |
          for request in examples/*.request.json; do
            swift run evo-ethicsctl evaluate "$request" > /tmp/decision.json
            .venv/bin/python -m json.tool /tmp/decision.json >/dev/null
          done
