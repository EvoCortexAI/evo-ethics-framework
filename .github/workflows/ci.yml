name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Intentionally trusted-only while external contributions are closed.
    # Public pull requests must never execute on EvoCortexAI self-hosted runners.
    runs-on: [self-hosted, macOS, ARM64, apple-ci, xcode-26-6]
    steps:
      - uses: actions/checkout@v4

      - name: Validate Swift package, repository artifacts, and conformance
        run: swift test

      - name: Smoke public CLI examples
        run: |
          set -euo pipefail
          for request in examples/*.request.json; do
            output="$(mktemp)"
            swift run evo-ethicsctl evaluate "$request" > "$output"
            test -s "$output"
            grep -q '"decision"' "$output"
            grep -q '"request_id"' "$output"
            rm -f "$output"
          done
