name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Validate Swift package
        run: swift test
      - name: Install schema validation dependencies
        run: python3 -m pip install --disable-pip-version-check jsonschema==4.26.0 PyYAML==6.0.3
      - name: Validate schemas, policies, examples, and vectors
        run: python3 scripts/validate_specs.py
      - name: Run cross-implementation conformance vectors
        run: |
          BIN_PATH="$(swift build --show-bin-path)/evo-ethicsctl"
          python3 scripts/run_conformance.py "$BIN_PATH"
      - name: Evaluate public examples
        run: |
          for request in examples/*.request.json; do
            swift run evo-ethicsctl evaluate "$request" > /tmp/decision.json
            python3 -m json.tool /tmp/decision.json >/dev/null
          done
