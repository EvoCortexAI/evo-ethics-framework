name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Same-repository branches are trusted while external contributions are closed.
    # Fork pull requests must never execute on EvoCortexAI self-hosted runners.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, apple-ci, xcode-26-6]
    steps:
      - uses: actions/checkout@v4

      - name: Validate Swift package
        run: swift test

      - name: Validate schemas, policies, examples, vectors, and conformance
        run: swift run evo-ethics-validate

      - name: Evaluate public examples through the stable CLI
        run: |
          set -euo pipefail
          output="${RUNNER_TEMP}/evo-ethics-decision.json"
          for request in examples/*.request.json; do
            swift run evo-ethicsctl evaluate "$request" > "$output"
            test -s "$output"
          done
